name: CI
on:
  push:
  pull_request:
jobs:
  go-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23'}
      - run: cd agent && go test -race ./...
      - run: cd agent && go vet ./...
      - run: cd agent && go build ./cmd/ssh-manager-helper
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm run test
      - run: npm run build:web
